# Git hooks for the Terraform project in infra/ (https://pre-commit.com). They call the tools installed in WSL (see
# infra/docs/DEVELOPMENT.md), so there are no hook repositories to download or pin. Install once per clone:
#   pipx install pre-commit && pre-commit install
# Run every hook on demand with: pre-commit run --all-files
# The mocked `terraform test` suite isn't a hook: run it yourself before pushing; CI runs it on every pull request.
repos:
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform -chdir=infra fmt -recursive
        language: system
        files: ^infra/.*\.(tf|tfvars|hcl)$
        pass_filenames: false

      - id: terraform-validate
        name: terraform validate
        entry: bash -c 'cd infra && terraform init -backend=false -input=false >/dev/null && terraform validate'
        language: system
        files: ^infra/.*\.(tf|hcl)$
        pass_filenames: false

      - id: tflint
        name: tflint
        entry: bash -c 'cd infra && tflint --init >/dev/null && tflint --recursive --format compact'
        language: system
        files: ^infra/.*\.(tf|hcl)$
        pass_filenames: false

      - id: terraform-docs
        name: terraform-docs (refreshes the README reference sections)
        entry: bash -c 'cd infra && terraform-docs . >/dev/null'
        language: system
        files: ^infra/(.*\.tf|.*README\.md|\.terraform-docs\.yml)$
        pass_filenames: false

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        files: ^(infra/|\.github/scripts/)
