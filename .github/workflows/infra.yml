# The infrastructure (infra/): checks, plans and gated applies.
#
#   pull request   credential-free checks (fmt, validate, mocked tests, TFLint, terraform-docs, ShellCheck), then a
#                  speculative plan, commented on the pull request ("infra-pr" environment, read-only identity).
#   push to main   the checks, a plan saved for apply ("demo-plan" environment), then terraform apply of exactly that
#                  plan once someone approves the "demo" environment, and a smoke test through Cloudflare.
#   manual run     on main: plan, and with "apply" ticked, the approval-gated apply. On another branch: checks and a
#                  speculative plan (the app workflow starts this for the deployment pull requests it opens).
#   schedule       weekly drift check: plans main against the real infrastructure and fails if anything differs.
#
# Security (docs/CI_CD.md): GitHub OIDC only, no stored Azure credentials. Each environment's federated credential
# leads to one identity: pull requests to one that can only read, main to the one that applies. Plans never print
# attribute values (the logs are public); the saved plan holds secrets, so it travels between jobs encrypted. Forks
# and Dependabot never reach a job with secrets.
name: infra

on:
  # Every pull request, so the "infra checks passed" status always reports; the changes job skips the work when the
  # pull request doesn't touch the infrastructure.
  pull_request:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - ".github/actions/terraform-init/**"
      - ".github/scripts/terraform-*"
      - ".github/scripts/smoke-test.sh"
  workflow_dispatch:
    inputs:
      apply:
        description: "On main: apply the plan after approval in the demo environment"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

concurrency:
  # One run per branch at a time. On main, runs queue instead of cancelling, so an apply is never interrupted and
  # every plan starts from the state the previous apply left (a newer pending run replaces an older pending one).
  group: infra-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Explicit bash runs every step with -eo pipefail, so a failure inside a pipeline fails the step.
    shell: bash

jobs:
  changes:
    name: Does this touch the infrastructure?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      infra: ${{ steps.diff.outputs.infra }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Compare with the base branch
        id: diff
        run: >-
          bash .github/scripts/changed-areas.sh infra
          '^(infra/|\.github/workflows/infra\.yml$|\.github/actions/terraform-init/|\.github/scripts/(terraform-|smoke-test))'

  checks:
    name: fmt, validate, test, lint
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: infra
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (providers and modules only, no backend)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: terraform validate
        run: terraform validate

      - name: terraform test (mocked providers)
        run: terraform test

      - name: Cache TFLint plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ hashFiles('infra/.tflint.hcl') }}

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact
        env:
          # tflint --init downloads the pinned ruleset from GitHub; the token avoids API rate limits.
          GITHUB_TOKEN: ${{ github.token }}

      - name: terraform-docs is up to date
        run: |
          curl -sSfLo "$RUNNER_TEMP/terraform-docs.tgz" \
            https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz
          echo "9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3  $RUNNER_TEMP/terraform-docs.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/terraform-docs.tgz" -C "$RUNNER_TEMP" terraform-docs
          "$RUNNER_TEMP/terraform-docs" --output-check . || { echo "::error::Run 'terraform-docs .' in infra/ and commit the result."; exit 1; }

      - name: shellcheck
        run: shellcheck modules/container-app/scripts/*.sh modules/observability/scripts/*.sh scripts/*.sh

  plan-pr:
    name: Speculative plan
    needs: [changes, checks]
    # Same-repository pull requests only: forks never get the environment's secrets, and Dependabot runs without
    # them (start a plan for its branch by hand: Actions, infra, Run workflow). Manual runs on other branches too.
    if: >-
      needs.changes.outputs.infra == 'true' && (
        (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && !startsWith(github.event.pull_request.head.ref, 'dependabot/'))
        || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: infra-pr
    permissions:
      contents: read
      id-token: write # OIDC sign-in as the read-only plan identity
      pull-requests: write # the plan comment
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: terraform init
        uses: ./.github/actions/terraform-init

      - name: terraform plan (no refresh, no lock)
        id: plan
        env:
          PLAN_MODE: pr
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TLS_CERTIFICATE_PFX_BASE64: ${{ secrets.TLS_CERTIFICATE_PFX_BASE64 }}
          TLS_CERTIFICATE_PFX_PASSWORD: ${{ secrets.TLS_CERTIFICATE_PFX_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GRAFANA_GITHUB_CLIENT_SECRET: ${{ secrets.GRAFANA_GITHUB_CLIENT_SECRET }}
        run: bash .github/scripts/terraform-plan.sh

      - name: Comment the plan on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.plan.outputs.summary }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ -z "$PR_NUMBER" ]]; then
            PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          fi
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No open pull request for $BRANCH; the plan is in the job summary."
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$SUMMARY" --edit-last --create-if-none

  plan:
    name: Plan for main
    needs: [changes, checks]
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Restricted to main. Planning needs a full refresh, which reads every resource and secret back, so it signs in
    # as the deploy identity; nothing in this job changes the infrastructure.
    environment: demo-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: terraform init
        uses: ./.github/actions/terraform-init

      - name: terraform plan
        id: plan
        env:
          PLAN_MODE: ${{ github.event_name == 'schedule' && 'drift' || 'deploy' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TLS_CERTIFICATE_PFX_BASE64: ${{ secrets.TLS_CERTIFICATE_PFX_BASE64 }}
          TLS_CERTIFICATE_PFX_PASSWORD: ${{ secrets.TLS_CERTIFICATE_PFX_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GRAFANA_GITHUB_CLIENT_SECRET: ${{ secrets.GRAFANA_GITHUB_CLIENT_SECRET }}
          TF_PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: bash .github/scripts/terraform-plan.sh

      - name: Keep the encrypted plan for the apply job
        if: github.event_name != 'schedule' && steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One plan per run. A re-run plans again and replaces it; re-running only a failed apply reuses it, and
          # Terraform refuses it if the state has changed since ("Saved plan is stale").
          name: tfplan-${{ github.run_id }}
          path: ${{ runner.temp }}/terraform/tfplan.gpg
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  apply:
    name: Apply the approved plan
    needs: plan
    if: >-
      needs.plan.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Required reviewers on this environment are the "apply?" decision. Read the plan job's summary first.
    environment:
      name: demo
      url: https://app.biffkittz.com
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: terraform init
        uses: ./.github/actions/terraform-init

      - name: Fetch the encrypted plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ runner.temp }}/terraform

      - name: terraform apply (the saved plan)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TLS_CERTIFICATE_PFX_BASE64: ${{ secrets.TLS_CERTIFICATE_PFX_BASE64 }}
          TF_PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: bash .github/scripts/terraform-apply.sh

      - name: Smoke test through Cloudflare
        run: bash .github/scripts/smoke-test.sh

  # The single status a branch ruleset requires for the infrastructure: passes when the checks and the pull request
  # plan passed or were skipped.
  checks-passed:
    name: infra checks passed
    if: always()
    needs: [changes, checks, plan-pr]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All checks passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            exit 1
          fi
